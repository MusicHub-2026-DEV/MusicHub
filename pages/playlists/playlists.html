<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - MusicHub</title>

    <link rel="stylesheet" href="../../Assets/css/base.css">
    <link rel="stylesheet" href="../../Assets/css/components.css">
    <link rel="stylesheet" href="playlists.css">
    <link rel="shortcut icon" href="../../Assets/Images/logo.png" type="image/x-icon">
</head>

<body>
    <header class="cabecalho">

        <a href="../home/home.html">
            <img src="../../Assets/Images/logo.png" alt="Music Hub" class="logo">
        </a>

        <nav class="menu">
            <a href="playlists.html" class="ativo">Playlists</a>
            <a href="../descobrir/descobrir.html">Descobrir</a>
            <a href="../artistas/artistas.html">Artistas</a>
        </nav>

        <div class="busca">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-search-icon lucide-search">
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
            </svg>
            <input type="text" placeholder="Search">
        </div>

        <span></span>

        <a href="../login/login.html" class="btn-entrar">Entrar</a>

    </header>

    <main>
        <section class="conteudo-cabecalho">
            <h1>Suas Playlists</h1>
            <div class="navegacao">
                <div class="abas">
                    <button data-aba="playlists" class="btn btn-primario">Playlists</button>
                    <button data-aba="favoritos" class="btn btn-secundario">Favoritos</button>
                    <button data-aba="artistas" class="btn btn-secundario">Artistas</button>
                </div>
                <div class="filtros">
                    <div class="busca">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-search-icon lucide-search">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                        <input type="text" placeholder="Search">
                    </div>
                    <button class="btn btn-secundario">Filtrar por</button>
                </div>

            </div>
        </section>
        <section class="conteudo" data-painel="playlists">
            <h2>Playlists</h2>
        </section>

        <section class="conteudo conteudo-desativado" data-painel="favoritos">
            <h2>Favoritos</h2>
        </section>

        <section class="conteudo conteudo-desativado" data-painel="artistas">
            <h2>Artistas</h2>
        </section>
    </main>

    <script src="../../Assets/js/playlists.js"></script>
</body>

</html>
